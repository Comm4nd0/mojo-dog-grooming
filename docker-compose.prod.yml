# Production stack for the Hetzner host.
#   cp .env.example .env   # fill in the secrets
#   ./deploy.sh
#
# Port 8010 is bound to the Docker bridge address rather than 0.0.0.0 so only
# Caddy can reach it. 8000-8009 are taken by the other projects on this host.

x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-app.mojoandco.uk}
  DJANGO_SECURE_HTTPS: ${DJANGO_SECURE_HTTPS:-True}
  DATABASE_URL: postgres://${POSTGRES_USER:-mojo}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-mojo}
  CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-False}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://app.mojoandco.uk}
  DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-info@mojoandco.uk}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mojo}
      POSTGRES_USER: ${POSTGRES_USER:-mojo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mojo} -d ${POSTGRES_DB:-mojo}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # This host runs eleven projects in under 4 GB. Capping the database keeps
    # one project from starving the others.
    mem_limit: 256m
    restart: unless-stopped

  web:
    build: .
    environment: *backend-environment
    volumes:
      # Dog photos. A host bind mount rather than a named volume so Caddy can
      # serve them read-only and so they are trivially backed up, matching how
      # p4td does it on this host.
      - ./media:/app/media
      # Scanned paperwork — intake forms, vaccination cards, vet letters.
      #
      # A SIBLING of ./media, never a child, and it must NOT be added to
      # Caddy's mount. Caddy serves /media/* with `file_server` and no
      # authentication, so anything reachable from there is world-readable to
      # anyone with the URL — and these carry a client's name, address,
      # postcode, phone, emergency contact and signature. They are served by a
      # gated Django view instead.
      #
      # Not covered by deploy.sh's pre-deploy pg_dump, which is database only.
      - ./private-media:/app/private-media
    depends_on:
      db:
        condition: service_healthy
    # Bound to the Docker bridge by default so only Caddy can reach it. Set
    # BIND_ADDRESS=0.0.0.0 in .env to expose it directly — useful before DNS
    # and TLS are in place, but it serves plain HTTP, so don't leave it there.
    ports:
      - "${BIND_ADDRESS:-172.17.0.1}:${HOST_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    restart: unless-stopped

volumes:
  pgdata:

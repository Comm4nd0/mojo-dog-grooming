name: mojo_app
description: "Mojo and Co — dog grooming management for staff and clients."
publish_to: 'none'

# The single source of truth for the version users see. `Info.plist` takes
# CFBundleShortVersionString from $(FLUTTER_BUILD_NAME), which comes from here,
# so this number is what appears on the App Store listing.
#
# It was 0.1.0 while 1.9.13 was live — a build from that would have been
# rejected, because App Store Connect will not take a version string below the
# one already released. Change it with `tools/release.sh`, which keeps it in
# step with the git tag and the changelog rather than leaving three places to
# remember.
#
# The build number after the + is a placeholder. CI replaces it with a
# monotonic one, because App Store Connect refuses a build number it has
# already seen and this file would otherwise upload as build 1 every time.
version: 1.10.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking and credential storage
  http: ^1.2.0
  flutter_secure_storage: ^9.2.4

  # Face ID / fingerprint unlock. A local gate in front of the token that is
  # already in secure storage — it does not re-authenticate against the API.
  # Android needs FlutterFragmentActivity and iOS needs NSFaceIDUsageDescription;
  # both are set, and neither is optional for this plugin.
  local_auth: ^2.3.0

  # Dog photos
  image_picker: ^1.0.8
  cached_network_image: ^3.4.1

  # Calendar and date/number formatting
  table_calendar: ^3.1.3
  intl: ^0.20.2

  # Brand typography (Playfair Display + Montserrat, as on mojoandco.uk)
  google_fonts: ^6.2.1

  # Renders the dog silhouette on the problem-area picker. Published by
  # flutter.dev; keeping the silhouette as an SVG asset means swapping it for a
  # different outline later is dropping in a file, not regenerating code.
  flutter_svg: ^2.3.0

  # Service locator
  get_it: ^7.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dog_silhouette.svg

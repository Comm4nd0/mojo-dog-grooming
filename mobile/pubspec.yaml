name: mojo_app
description: "Mojo and Co — dog grooming management for staff and clients."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking and credential storage
  http: ^1.2.0
  flutter_secure_storage: ^9.2.4

  # Dog photos
  image_picker: ^1.0.8
  cached_network_image: ^3.4.1

  # Calendar and date/number formatting
  table_calendar: ^3.1.3
  intl: ^0.20.2

  # Brand typography (Playfair Display + Montserrat, as on mojoandco.uk)
  google_fonts: ^6.2.1

  # Service locator
  get_it: ^7.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

name: Check App Store credentials

# Answers one question — are the three APP_STORE_CONNECT_* secrets right? — and
# does nothing else. Run it from the Actions tab after setting them up, rather
# than finding out during a real release that the key is scoped too low.
#
# It cannot submit, upload or change anything. Safe to run whenever.
on:
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install "PyJWT[crypto]" requests

      - name: Check the key
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python tools/appstore_release.py --check-credentials

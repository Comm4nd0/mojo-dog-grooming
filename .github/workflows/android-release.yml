name: Android release bundle

# Builds a signed app bundle (.aab) and puts it on Google Play's internal
# testing track — the Android half of what Xcode Cloud does for TestFlight.
#
# Runs on every push to main that touches the app, and by hand from the Actions
# tab (where the track can be changed). The bundle is also kept as an artifact.
#
# Required repository secrets:
#   ANDROID_UPLOAD_KEYSTORE_BASE64    the upload keystore (PKCS12), base64-encoded
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD  its password (the key's password is the same)
#   PLAY_STORE_SERVICE_ACCOUNT_JSON   Play service account key, for the upload.
#                                     Without it the build still runs and the
#                                     bundle is left as an artifact.
#
# The keystore itself lives outside the repo; losing it means asking Google
# support to reset the upload key, so keep the original somewhere safe.

on:
  push:
    branches: [main]
    # Backend-only and docs-only pushes do not change the app, and a build
    # nobody needs still lands on every tester's phone as an update.
    paths:
      - "mobile/**"
      - ".github/workflows/android-release.yml"
      - "!mobile/store/**"
      - "!mobile/**/*.md"
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to"
        type: choice
        options: ["internal", "alpha", "beta"]
        default: "internal"
      upload:
        description: "Upload to Google Play (otherwise build the artifact only)"
        type: boolean
        default: true

# Two pushes in quick succession: build the newer one only. The build number is
# the clock, so the later build is always the higher version code anyway.
concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve the pinned Flutter version
        id: flutter_pin
        run: echo "version=$(cat "$GITHUB_WORKSPACE/mobile/.flutter-version")" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_pin.outputs.version }}

      - name: Write the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          # Refuse rather than build: without these the release build falls back
          # to the debug key, and Play rejects that only after the upload.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 and ANDROID_UPLOAD_KEYSTORE_PASSWORD must be set"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.p12
          {
            echo "storeFile=upload-keystore.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build the bundle
        run: |
          # Build numbers are minutes since 2026-01-01, the same scheme Xcode
          # Cloud uses, so every build is higher than the last without anything
          # to remember. Play refuses a version code it has seen before.
          BUILD_NUMBER=$(( ( $(date -u +%s) - $(date -u -d 2026-01-01 +%s) ) / 60 ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          flutter build appbundle --release --build-number="$BUILD_NUMBER"

      - name: Check it is signed with the upload key, not the debug key
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          SIGNER=$(keytool -printcert -jarfile "$AAB")
          echo "$SIGNER" | grep -E "Owner|SHA1|SHA256"
          if echo "$SIGNER" | grep -q "CN=Android Debug"; then
            echo "::error::The bundle is signed with the debug key. Play will refuse it."
            exit 1
          fi
          echo "$SIGNER" | grep -q "CN=Mojo and Co" || { echo "::error::Unexpected signer"; exit 1; }

      - name: Remove the key from the runner
        if: always()
        run: rm -f android/upload-keystore.p12 android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: mojo-and-co-android-${{ env.BUILD_NUMBER }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - uses: ruby/setup-ruby@v1
        if: ${{ github.event_name == 'push' || inputs.upload }}
        with:
          ruby-version: "3.3"

      - name: Upload to Google Play
        if: ${{ github.event_name == 'push' || inputs.upload }}
        env:
          # Through env, never interpolated into the script: the key is JSON,
          # and quotes inside it would break (or rewrite) an inline shell line.
          PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.track || 'internal' }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::warning::PLAY_STORE_SERVICE_ACCOUNT_JSON is not set, so nothing was uploaded. The bundle is in this run's artifacts."
            exit 0
          fi
          gem install fastlane --no-document
          umask 077
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
          export SUPPLY_JSON_KEY="$RUNNER_TEMP/play.json"
          export AAB_PATH="$PWD/build/app/outputs/bundle/release/app-release.aab"
          (cd fastlane && fastlane android upload_bundle)
          echo "::notice::Build $BUILD_NUMBER is on the $PLAY_TRACK track."

      - name: Remove the Play key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/play.json"
